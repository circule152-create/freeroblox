<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roblox Account Finder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #08090d;
      --card: rgba(19, 21, 29, 0.82);
      --border: rgba(255,255,255,.09);
      --text: #f5f7fb;
      --muted: #8f96a8;
      --accent: #ffffff;
      --danger: #ff5b6e;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(84, 93, 255, .16), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(0, 220, 255, .10), transparent 28%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(760px, 100%);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 12px 40px rgba(255,255,255,.12);
    }

    .logo svg {
      width: 25px;
      height: 25px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: -1.7px;
      line-height: 1;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 7px;
      font-size: 14px;
    }

    .panel {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
    }

    .search {
      display: flex;
      gap: 10px;
    }

    .input-wrap {
      flex: 1;
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      opacity: .55;
      pointer-events: none;
    }

    input {
      width: 100%;
      height: 56px;
      border-radius: 16px;
      border: 1px solid var(--border);
      outline: none;
      background: rgba(255,255,255,.045);
      color: white;
      font-size: 16px;
      padding: 0 16px 0 47px;
      transition: .2s ease;
    }

    input:focus {
      border-color: rgba(255,255,255,.28);
      background: rgba(255,255,255,.065);
      box-shadow: 0 0 0 4px rgba(255,255,255,.04);
    }

    input::placeholder {
      color: #666d7d;
    }

    button {
      height: 56px;
      padding: 0 22px;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      color: #08090d;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(1px) scale(.99); }
    button:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    .status {
      min-height: 22px;
      margin: 13px 3px 0;
      font-size: 13px;
      color: var(--muted);
    }

    .status.error { color: var(--danger); }

    .result {
      display: none;
      margin-top: 15px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(255,255,255,.035);
      animation: appear .35s ease;
    }

    .result.show { display: block; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .avatar-shell {
      width: 116px;
      height: 116px;
      flex: 0 0 116px;
      border-radius: 24px;
      overflow: hidden;
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
    }

    .avatar {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .display-name {
      font-size: 25px;
      font-weight: 850;
      letter-spacing: -.7px;
      overflow-wrap: anywhere;
    }

    .username {
      color: var(--muted);
      margin-top: 3px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .pill {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      font-size: 12px;
      color: #c9ceda;
    }

    .open-profile {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 750;
    }

    .open-profile svg {
      width: 15px;
      height: 15px;
    }

    .loader {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.18);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -2px;
      margin-right: 7px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hint {
      text-align: center;
      color: #5e6574;
      font-size: 12px;
      margin-top: 16px;
    }

    @media (max-width: 620px) {
      .search { flex-direction: column; }
      button { width: 100%; }
      .profile { align-items: flex-start; }
      .avatar-shell {
        width: 92px;
        height: 92px;
        flex-basis: 92px;
        border-radius: 20px;
      }
      .display-name { font-size: 21px; }
    }
  </style>
</head>
<body>
  <!-- Bismillah -->
  <main class="app">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M8.5 3 29 8.5 23.5 29 3 23.5 8.5 3Z" fill="#0b0c10"/>
          <path d="M13 11.5 20.5 13 19 20.5 11.5 19 13 11.5Z" fill="white"/>
        </svg>
      </div>
      <div>
        <h1>Roblox Finder</h1>
        <div class="subtitle">Username orqali Roblox accountni toping.</div>
      </div>
    </div>

    <section class="panel">
      <div class="search">
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.6-3.6"></path>
          </svg>
          <input
            id="usernameInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            maxlength="20"
            placeholder="Masalan: Builderman"
          />
        </div>
        <button id="searchBtn">Accountni topish</button>
      </div>

      <div id="status" class="status">Roblox username kiriting.</div>

      <div id="result" class="result">
        <div class="profile">
          <div class="avatar-shell">
            <img id="avatar" class="avatar" alt="Roblox avatar" />
          </div>

          <div class="info">
            <div id="displayName" class="display-name"></div>
            <div id="username" class="username"></div>

            <div class="details">
              <div id="userId" class="pill"></div>
              <div id="verified" class="pill" style="display:none;"></div>
            </div>

            <a id="profileLink" class="open-profile" target="_blank" rel="noopener noreferrer">
              Roblox profilini ochish
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 5h5v5"></path>
                <path d="M10 14 19 5"></path>
                <path d="M19 13v6H5V5h6"></path>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </section>

    <div class="hint">Faqat public Roblox ma'lumotlari ko'rsatiladi.</div>
  </main>

  <script>
    const input = document.getElementById("usernameInput");
    const btn = document.getElementById("searchBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const avatarEl = document.getElementById("avatar");
    const displayNameEl = document.getElementById("displayName");
    const usernameEl = document.getElementById("username");
    const userIdEl = document.getElementById("userId");
    const verifiedEl = document.getElementById("verified");
    const profileLinkEl = document.getElementById("profileLink");

    function setStatus(message, error = false) {
      statusEl.innerHTML = message;
      statusEl.classList.toggle("error", error);
    }

    async function findAccount() {
      const username = input.value.trim();

      resultEl.classList.remove("show");

      if (!username) {
        setStatus("Username kiriting.", true);
        input.focus();
        return;
      }

      btn.disabled = true;
      setStatus('<span class="loader"></span>Account qidirilmoqda...');

      try {
        const robloxSearchUrl =
          "https://users.roblox.com/v1/users/search?keyword=" +
          encodeURIComponent(username) +
          "&limit=10";

        /*
          GitHub Pages static bo'lgani uchun browser CORS muammosini
          chetlab o'tish uchun read-only public endpointga proxy ishlatamiz.
          Birinchi proxy ishlamasa ikkinchi proxy avtomatik sinab ko'riladi.
        */
        const proxyUrls = [
          {
            url: "https://api.allorigins.win/get?url=" +
              encodeURIComponent(robloxSearchUrl),
            parse: async (response) => {
              const wrapper = await response.json();
              if (!wrapper || typeof wrapper.contents !== "string") {
                throw new Error("AllOrigins invalid response");
              }
              return JSON.parse(wrapper.contents);
            }
          },
          {
            url: "https://corsproxy.io/?url=" +
              encodeURIComponent(robloxSearchUrl),
            parse: async (response) => response.json()
          }
        ];

        let userData = null;
        let lastError = null;

        for (const proxy of proxyUrls) {
          try {
            const userResponse = await fetch(proxy.url, {
              method: "GET",
              cache: "no-store"
            });

            if (!userResponse.ok) {
              throw new Error("Proxy HTTP " + userResponse.status);
            }

            userData = await proxy.parse(userResponse);
            break;
          } catch (err) {
            lastError = err;
          }
        }

        if (!userData) {
          throw new Error(
            "Roblox search proxy ishlamadi: " +
            (lastError ? lastError.message : "unknown error")
          );
        }
        const users = Array.isArray(userData.data) ? userData.data : [];

        // Exact username match first; otherwise don't accidentally show
        // a different account returned by keyword search.
        const user =
          users.find(u => String(u.name || "").toLowerCase() === username.toLowerCase()) ||
          null;

        if (!user) {
          setStatus(
            users.length
              ? "Aniq shu username topilmadi. Username'ni tekshiring."
              : "Bunday Roblox account topilmadi.",
            true
          );
          return;
        }

        setStatus('<span class="loader"></span>Avatar yuklanmoqda...');

        const thumbUrl =
          "https://thumbnails.roblox.com/v1/users/avatar-headshot" +
          "?userIds=" + encodeURIComponent(user.id) +
          "&size=420x420&format=Png&isCircular=false";

        const thumbResponse = await fetch(thumbUrl, {
          method: "GET",
          mode: "cors",
          cache: "no-store"
        });

        if (!thumbResponse.ok) {
          throw new Error("Roblox thumbnail API HTTP " + thumbResponse.status);
        }

        const thumbData = await thumbResponse.json();
        const thumbnail = thumbData.data && thumbData.data[0];

        if (thumbnail && thumbnail.imageUrl) {
          avatarEl.src = thumbnail.imageUrl;
        } else {
          avatarEl.removeAttribute("src");
          avatarEl.alt = "Avatar mavjud emas";
        }

        displayNameEl.textContent = user.displayName || user.name;
        usernameEl.textContent = "@" + user.name;
        userIdEl.textContent = "User ID: " + user.id;

        if (user.hasVerifiedBadge === true) {
          verifiedEl.textContent = "Verified";
          verifiedEl.style.display = "inline-block";
        } else {
          verifiedEl.style.display = "none";
        }

        profileLinkEl.href =
          "https://www.roblox.com/users/" + user.id + "/profile";

        resultEl.classList.add("show");
        setStatus("Account topildi.");
      } catch (error) {
        console.error("Roblox Finder:", error);

        if (error instanceof TypeError) {
          setStatus(
            "Qidiruv serveriga ulanish amalga oshmadi. Ctrl + Shift + R qilib qayta yuklang yoki birozdan keyin urinib ko‘ring.",
            true
          );
        } else {
          setStatus(
            "Roblox serveri so'rovni qabul qilmadi. Bir ozdan keyin qayta urinib ko'ring.",
            true
          );
        }
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", findAccount);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        findAccount();
      }
    });
  </script>
</body>
</html>
